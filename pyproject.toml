[project]
name = "reviewer"
requires-python = ">=3.13"
dependencies = [
    "Django",
    "social-auth-app-django",
    "mysqlclient",
    "requests",
    "deepmerge",
    "djangorestframework",
    "django_bootstrap5",
    "PyYAML",
    "gunicorn",
    "whitenoise",
    "celery[redis]",
    "prometheus-client",
    # Unreleased master supports Django 6.1; switch back to PyPI once released
    # renovate-gate: django-prometheus==2.5.0
    "django-prometheus @ git+https://github.com/django-commons/django-prometheus@c04929aac027bde8410bde20af6ca864a1e6929d",
    "flower",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.test.dependencies]
tox = "*"
tox-current-env = "*"
black = "*"
ruff = "*"
djlint = "*"
bandit = "*"
selenium = "*"
pytest-django = "*"
pytest = "*"
pytest-xdist = "*"
freezegun = "*"

[tool.ruff]
exclude = ['*/migrations/*', 've/*', '.tox/*']
line-length = 120

[tool.djlint]
profile = 'django'
use_gitignore = true
max_attribute_length = 120

[tool.black]
line-length = 120
extend-exclude = '''
(
  ^/ve
  |
  ^.*/migrations/.*
)
'''

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cbng_reviewer.settings"
addopts = "--strict-markers"
markers = [
    "unmarked",
    "replica",
    "integration",
    "interactive",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
